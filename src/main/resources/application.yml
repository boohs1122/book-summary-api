spring:
  application:
    name: booksummary
  datasource:
    # 개발 기본값은 파일 H2. 배포 환경은 환경 변수로 덮어쓴다
    url: ${DB_URL:jdbc:h2:file:./.h2/booksummary}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
